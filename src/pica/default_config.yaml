camera_id: 0
confidence_threshold: 0.75

# lifts dim frames so hand tracking survives a dark room
# auto = only when the frame is dark, on = always, off = never
night_mode:
  mode: auto
  darkness_threshold: 60  # mean pixel value below which a frame counts as dark

# gesture name -> action name (handled in src/components/system_control.py)
# hotkey:a,b,c presses a key combo instead, using pyautogui key names -- so a new
# binding is an edit here rather than a code change
# a two_hand_ prefix means both hands holding that gesture at once
gestures:
  close_palm: left_drag
  one_finger_up: volume_up
  one_finger_down: volume_down
  three_finger_up: brightness_up
  three_finger_down: brightness_down
  four_finger_up: hotkey:ctrl,win,right
  four_finger_down: hotkey:ctrl,win,left
  two_hand_open_palm: hotkey:win,ctrl,o   # windows on-screen keyboard, click the keys with close_palm

cursor:
  gesture: open_palm       # gesture name that drives cursor movement
  landmark_index: 0        # wrist -- stays stable while fingers curl into the click gesture
  smoothing: 0.2           # 0 = no smoothing, closer to 1 = smoother/slower
  margin: 0.2               # fraction of frame edge ignored; smaller hand movement covers full screen
  confidence_threshold: 0.6 # lower bar than clicks -- a missed cursor frame just looks laggy, not risky

# scroll is continuous while the gesture is held, not cooldown-gated like a click
scroll:
  up_gesture: two_finger_up
  down_gesture: two_finger_down
  amount: 100

brightness:
  step: 20  # percent added or removed per gesture

action_cooldown_seconds: 0.6

# close_palm doubles as click and drag: let go before this and it clicks,
# keep holding and it presses the button down so you can move windows
drag_hold_seconds: 2.0
click_min_hold_seconds: 0.1  # ignores a single misdetected frame
