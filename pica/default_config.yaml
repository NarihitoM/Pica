camera_id: 0
confidence_threshold: 0.75

# gesture name -> action name (handled in src/components/system_control.py)
gestures:
  close_palm: left_drag
  one_finger_up: volume_up
  one_finger_down: volume_down
  three_finger_up: brightness_up
  three_finger_down: brightness_down

cursor:
  gesture: open_palm       # gesture name that drives cursor movement
  landmark_index: 0        # wrist -- stays stable while fingers curl into the click gesture
  smoothing: 0.2           # 0 = no smoothing, closer to 1 = smoother/slower
  margin: 0.2               # fraction of frame edge ignored; smaller hand movement covers full screen
  confidence_threshold: 0.6 # lower bar than clicks -- a missed cursor frame just looks laggy, not risky

# scroll is continuous while the gesture is held, not cooldown-gated like a click
scroll:
  up_gesture: two_finger_up
  down_gesture: two_finger_down
  amount: 100

brightness:
  step: 20  # percent added or removed per gesture

action_cooldown_seconds: 0.6
