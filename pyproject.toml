[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narihito-pica"
version = "0.4.0"
description = "Pica is the project that can control and manage your laptop or pc with the gestures."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NarihitoM" }]
keywords = ["gesture", "mediapipe", "computer-vision", "hand-tracking", "accessibility"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "opencv-python",
    "mediapipe",
    "torch",
    "pyautogui",
    "pyyaml",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/NarihitoM/Pica"
Issues = "https://github.com/NarihitoM/Pica/issues"

[project.scripts]
narihito-pica = "pica.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pica*"]

[tool.setuptools.package-data]
pica = ["default_config.yaml", "assets/*"]

[tool.mypy]
ignore_missing_imports = true
