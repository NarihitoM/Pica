name: Publish

on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:
    inputs:
      force:
        description: "Publish even if PyPI already reports this version (finishes a partial upload)"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Is this version already on PyPI?
        id: check
        run: |
          NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "forced, publishing $NAME $VERSION"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif curl -sf "https://pypi.org/pypi/$NAME/$VERSION/json" > /dev/null; then
            echo "$NAME $VERSION is already published, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME $VERSION is new, publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: pip install build twine

      - if: steps.check.outputs.publish == 'true'
        run: python -m build

      - if: steps.check.outputs.publish == 'true'
        run: python -m twine check dist/*

      - if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # a rerun after a half finished upload should carry on, not fail on the
          # file that already made it through
          skip-existing: true

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          TAG="v${{ steps.check.outputs.version }}"
          if git ls-remote --exit-code --tags origin "$TAG" > /dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
