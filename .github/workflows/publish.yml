name: Publish

on:
  push:
    branches: [main]
    paths: ["pyproject.toml"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Is this version already on PyPI?
        id: check
        run: |
          NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if curl -sf "https://pypi.org/pypi/$NAME/$VERSION/json" > /dev/null; then
            echo "$NAME $VERSION is already published, nothing to do"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$NAME $VERSION is new, publishing"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: pip install build twine

      - if: steps.check.outputs.publish == 'true'
        run: python -m build

      - if: steps.check.outputs.publish == 'true'
        run: python -m twine check dist/*

      - if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag the release
        if: steps.check.outputs.publish == 'true'
        run: |
          git tag "v${{ steps.check.outputs.version }}"
          git push origin "v${{ steps.check.outputs.version }}"
